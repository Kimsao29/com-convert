<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Unit Converter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        input, select {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
        }

        button {
            margin-top: 20px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .result {
            margin-top: 22px;
            padding: 20px;
            border-radius: 12px;
            background: #eff6ff;
            text-align: center;
        }

        .result h2 {
            margin: 0 0 10px;
            color: #1d4ed8;
            font-size: 18px;
        }

        #output {
            font-size: 25px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .student {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>💻 Computer Unit Converter</h1>
        <p class="subtitle">โปรแกรมแปลงหน่วยทางคอมพิวเตอร์</p>

        <label for="category">เลือกประเภทหน่วย</label>
        <select id="category" onchange="updateUnits()">
            <option value="data">หน่วยข้อมูล (Byte)</option>
            <option value="speed">ความเร็วในการรับส่งข้อมูล (bps)</option>
        </select>

        <label for="amount">จำนวนที่ต้องการแปลง</label>
        <input type="number" id="amount" value="1" min="0" step="any">

        <label for="fromUnit">หน่วยต้นทาง</label>
        <select id="fromUnit"></select>

        <label for="toUnit">หน่วยปลายทาง</label>
        <select id="toUnit"></select>

        <button onclick="convertUnit()">แปลงหน่วย</button>

        <section class="result">
            <h2>ผลลัพธ์</h2>
            <div id="output">กรุณากดแปลงหน่วย</div>
        </section>

        <div class="student">
            <p>จัดทำโดย: <strong>นายพิชญะ ภูปุย</strong></p>
            <p>Computer Unit Converter Project</p>
        </div>
    </main>

    <script>
        const units = {
            data: {
                "Byte (B)": 1,
                "Kilobyte (KB)": 1000,
                "Megabyte (MB)": 1000000,
                "Gigabyte (GB)": 1000000000,
                "Terabyte (TB)": 1000000000000,
                "Kibibyte (KiB)": 1024,
                "Mebibyte (MiB)": 1048576,
                "Gibibyte (GiB)": 1073741824
            },
            speed: {
                "Bit/s (bps)": 1,
                "Kilobit/s (Kbps)": 1000,
                "Megabit/s (Mbps)": 1000000,
                "Gigabit/s (Gbps)": 1000000000
            }
        };

        function updateUnits() {
            const category = document.getElementById("category").value;
            const from = document.getElementById("fromUnit");
            const to = document.getElementById("toUnit");

            from.innerHTML = "";
            to.innerHTML = "";

            Object.keys(units[category]).forEach((unit, index) => {
                from.add(new Option(unit, unit));
                to.add(new Option(unit, unit));
            });

            if (category === "data") {
                from.value = "Megabyte (MB)";
                to.value = "Kilobyte (KB)";
            } else {
                from.value = "Megabit/s (Mbps)";
                to.value = "Kilobit/s (Kbps)";
            }

            document.getElementById("output").textContent =
                "กรุณากดแปลงหน่วย";
        }

        function convertUnit() {
            const category = document.getElementById("category").value;
            const amount = Number(document.getElementById("amount").value);
            const from = document.getElementById("fromUnit").value;
            const to = document.getElementById("toUnit").value;

            if (document.getElementById("amount").value.trim() === ""
                || !Number.isFinite(amount) || amount < 0) {
                document.getElementById("output").textContent =
                    "กรุณากรอกจำนวนที่ถูกต้อง";
                return;
            }

            const baseValue = amount * units[category][from];
            const result = baseValue / units[category][to];

            document.getElementById("output").textContent =
                `${result.toLocaleString("en-US", {
                    maximumSignificantDigits: 12
                })} ${to}`;
        }

        updateUnits();
        convertUnit();
    </script>
</body>
</html>
